# The whole system: Kafka, a Flink cluster with the job baked in, the producer and the dashboard.
#
#   docker compose --profile demo up -d --build   # no download needed: replays a bundled slice of the real
#                                                 # data, checks Flink's output against the reference,
#                                                 # and serves the dashboard (see docs/TESTING.md)
#   docker compose --profile app up -d --build    # the real thing: replays the week from ./data
#   docker compose up -d --build                  # only Kafka + Flink, for the experiment scripts
#
# Tunables (environment variables, or put them in a .env file):
#   TM_CPUS / TM_SLOTS   CPU cores and task slots of the TaskManager (default: no CPU cap / 4 slots)
#   PARALLELISM          parallelism of the submitted job (default 4)
#   DAYS, SPEED, RATE    what the producer replays and how fast (see producer/producer.py)
#   DEMO_INPUT           what the demo replays: "slice" (real data, default) or "synthetic" (2M events)
#   IMAGE_PREFIX         e.g. ghcr.io/<owner>/ to run prebuilt images instead of building them

x-flink-env: &flink-env
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    taskmanager.numberOfTaskSlots: ${TM_SLOTS:-4}
    taskmanager.memory.process.size: ${TM_MEMORY:-3g}
    jobmanager.memory.process.size: 1g
    parallelism.default: ${PARALLELISM:-4}
    rest.flamegraph.enabled: true

x-flink-build: &flink-build
  context: .
  dockerfile: flink-job/Dockerfile

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        KT="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092"
        # retention.ms=-1: records carry 2021 event-time timestamps, which the default 7-day retention would delete
        $$KT --create --if-not-exists --topic ticks --partitions ${PARTITIONS:-8} --replication-factor 1 --config retention.ms=-1
        for t in ema-results advisories late-trades; do
          $$KT --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1 --config retention.ms=-1
        done
        $$KT --list
    restart: "no"

  jobmanager:
    build: *flink-build
    image: ${IMAGE_PREFIX:-}ssdm-flink:${IMAGE_TAG:-1.0}
    container_name: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment: *flink-env

  taskmanager:
    build: *flink-build
    image: ${IMAGE_PREFIX:-}ssdm-flink:${IMAGE_TAG:-1.0}
    container_name: taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    # 0 = no cap, so the stack also starts on machines with fewer than 4 cores.
    # The experiment scripts set TM_CPUS to pin the TaskManager to 1, 2 or 4 cores.
    cpus: ${TM_CPUS:-0}
    environment: *flink-env

  # ---- profiles "app" and "demo": submit the job, feed it, show the results

  job:
    build: *flink-build
    image: ${IMAGE_PREFIX:-}ssdm-flink:${IMAGE_TAG:-1.0}
    profiles: ["app", "demo"]
    depends_on:
      taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Retry until the JobManager answers; the job then waits for the TaskManager's slots
        until flink run -m jobmanager:8081 -d -p ${PARALLELISM:-4} /opt/ssdm/trading-job.jar \
          --subscriptions @/opt/ssdm/config/subscriptions.txt; do sleep 5; done
    restart: "no"

  producer:
    build: .
    image: ${IMAGE_PREFIX:-}ssdm-python:${IMAGE_TAG:-1.0}
    profiles: ["app"]
    depends_on:
      job:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data:ro
    command: >
      python producer/producer.py --bootstrap kafka:29092
      --days ${DAYS:-weekdays} --speed ${SPEED:-0} --rate ${RATE:-0}
    restart: "no"

  # The demo replays data that ships inside the image, so it runs without downloading anything.
  # "slice" is a real excerpt of the DEBS 2022 data (two busy Frankfurt symbols, Monday and Tuesday);
  # "synthetic" is three generated days (Mon to Wed, 700,000 events each) in the same layout, with a
  # long tail of symbols, quotes, placeholder times and out-of-order trades (tools/synth.py).
  demo-producer:
    build: .
    image: ${IMAGE_PREFIX:-}ssdm-python:${IMAGE_TAG:-1.0}
    profiles: ["demo"]
    depends_on:
      job:
        condition: service_completed_successfully
    volumes:
      - demo:/demo
    command:
      - bash
      - -c
      - |
        set -e
        if [ "${DEMO_INPUT:-slice}" = synthetic ]; then
          FILES=""
          for d in 08 09 10; do
            python -m tools.synth -n 700000 --date $$d-11-2021 --seed $$d -o /demo/synthetic-$$d.csv
            FILES="$$FILES /demo/synthetic-$$d.csv"
          done
        else
          cp analysis/test-slice.csv /demo/slice.csv
          FILES=/demo/slice.csv
        fi
        echo $$FILES > /demo/inputs.txt
        python producer/producer.py --bootstrap kafka:29092 $$(printf -- '--file %s ' $$FILES) --rate ${RATE:-0}
    restart: "no"

  # Reads what Flink published and compares it, window by window, with the pandas reference
  verify:
    build: .
    image: ${IMAGE_PREFIX:-}ssdm-python:${IMAGE_TAG:-1.0}
    profiles: ["demo"]
    depends_on:
      demo-producer:
        condition: service_completed_successfully
    volumes:
      - demo:/demo
    command:
      - bash
      - -c
      - |
        set -e
        python -m tools.dump_topic ema-results /demo/flink.jsonl --bootstrap kafka:29092 --idle 20 --wait-first 180
        python -m tools.validate --flink /demo/flink.jsonl $$(printf -- '--csv %s ' $$(cat /demo/inputs.txt)) --symbols-from-flink
        echo "Dashboard: http://localhost:8501   Flink UI: http://localhost:8081"
    restart: "no"

  dashboard:
    build: .
    image: ${IMAGE_PREFIX:-}ssdm-python:${IMAGE_TAG:-1.0}
    profiles: ["app", "demo"]
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "8501:8501"
    command: streamlit run dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0

volumes:
  demo:
