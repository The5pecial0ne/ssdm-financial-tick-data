services:

 kafka:
  image: apache/kafka:latest
  container_name: kafka
  ports:
   - "9092:9092"

 jobmanager:
  image: flink:1.20
  container_name: jobmanager
  command: jobmanager
  ports:
   - "8081:8081"
  environment:
   - JOB_MANAGER_RPC_ADDRESS=jobmanager

 taskmanager:
  image: flink:1.20
  container_name: taskmanager
  command: taskmanager
  depends_on:
   - jobmanager
  environment:
   - JOB_MANAGER_RPC_ADDRESS=jobmanager
