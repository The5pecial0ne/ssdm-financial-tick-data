# The whole system: Kafka, a Flink cluster with the job baked in, and (profile "app")
# the job submission, producer and dashboard.
#
#   docker compose up -d --build                 # Kafka + Flink, topics created
#   docker compose --profile app up -d --build   # ...plus submit the job, replay the data, dashboard
#
# Tunables (environment variables, or put them in a .env file):
#   TM_CPUS / TM_SLOTS   CPU cores and task slots of the TaskManager (default 4 / 4)
#   PARALLELISM          parallelism of the submitted job (default 4)
#   DAYS, SPEED          what the producer replays and how fast (see producer/producer.py)

x-flink-env: &flink-env
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    taskmanager.numberOfTaskSlots: ${TM_SLOTS:-4}
    taskmanager.memory.process.size: ${TM_MEMORY:-3g}
    jobmanager.memory.process.size: 1g
    parallelism.default: ${PARALLELISM:-4}
    rest.flamegraph.enabled: true

x-flink-build: &flink-build
  context: .
  dockerfile: flink-job/Dockerfile

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        KT="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092"
        $$KT --create --if-not-exists --topic ticks --partitions ${PARTITIONS:-8} --replication-factor 1
        for t in ema-results advisories late-trades; do
          $$KT --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
        $$KT --list
    restart: "no"

  jobmanager:
    build: *flink-build
    image: ssdm-flink:1.0
    container_name: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment: *flink-env

  taskmanager:
    build: *flink-build
    image: ssdm-flink:1.0
    container_name: taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    cpus: ${TM_CPUS:-4}
    environment: *flink-env

  # ---- profile "app": the end-to-end demo

  job:
    build: *flink-build
    image: ssdm-flink:1.0
    profiles: ["app"]
    depends_on:
      - taskmanager
      - kafka-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Retry until the JobManager answers; the job then waits for the TaskManager's slots
        until flink run -m jobmanager:8081 -d -p ${PARALLELISM:-4} /opt/ssdm/trading-job.jar \
          --subscriptions @/opt/ssdm/config/subscriptions.txt; do sleep 5; done
    restart: "no"

  producer:
    build: .
    image: ssdm-python:1.0
    profiles: ["app"]
    depends_on:
      - job
    volumes:
      - ./data:/app/data:ro
    command: >
      bash -c "sleep 20 && python producer/producer.py --bootstrap kafka:29092
      --days ${DAYS:-weekdays} --speed ${SPEED:-0} --rate ${RATE:-0}"
    restart: "no"

  dashboard:
    build: .
    image: ssdm-python:1.0
    profiles: ["app"]
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "8501:8501"
    command: streamlit run dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0
