# Look and feel of the dashboard. Streamlit reads this from the folder you launch it in,
# so run `streamlit run dashboard/dashboard.py` from the repository root (Docker does).
#
# Colours come from one validated palette, with separate steps for light and dark mode.
# The app follows the viewer's system setting, and the menu (top right) can switch it.

[client]
toolbarMode = "minimal"   # hides the developer-only buttons like "Deploy"

[browser]
gatherUsageStats = false

[theme]
font = "system-ui, -apple-system, 'Segoe UI', sans-serif"
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["2.25rem", "1.5rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 650
paddingTop = "2.5rem"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ef"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
dataframeBorderColor = "#ebeae6"
dataframeHeaderBackgroundColor = "#f6f5f2"
linkColor = "#256abf"
greenColor = "#008300"
greenTextColor = "#006300"
redColor = "#e34948"
redTextColor = "#c43232"
blueColor = "#2a78d6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#f3f2ef"
secondaryBackgroundColor = "#fcfcfb"
borderColor = "#dcdbd4"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f0efec"
borderColor = "#383835"
dataframeBorderColor = "#2c2c2a"
dataframeHeaderBackgroundColor = "#222220"
linkColor = "#6da7ec"
greenColor = "#0ca30c"
greenTextColor = "#0ca30c"
redColor = "#e66767"
redTextColor = "#e66767"
blueColor = "#3987e5"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#121211"
secondaryBackgroundColor = "#1a1a19"
borderColor = "#2c2c2a"
