# Publishes the two images to GitHub's container registry (ghcr.io), built for both ordinary PCs
# (amd64) and Apple Silicon (arm64), so anyone can run the system without building it:
#
#   IMAGE_PREFIX=ghcr.io/<owner>/ docker compose --profile demo pull
#   IMAGE_PREFIX=ghcr.io/<owner>/ docker compose --profile demo up -d --no-build
#
# It only runs when someone starts it by hand: Actions tab -> "publish images" -> Run workflow.
# After the first run, check that both packages are public (the repository's Packages, then
# Package settings -> Change visibility), or a grader's `docker pull` will ask for a login.
name: publish images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (docker-compose.yml uses 1.0 unless IMAGE_TAG says otherwise)
        default: "1.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registry names must be lowercase
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Flink image (Flink 1.20 with the job inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: flink-job/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.prefix }}ssdm-flink:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Flink cluster image with the EMA trading job
      - name: Python image (producer, dashboard, checks)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.prefix }}ssdm-python:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Producer, dashboard and validation tools
      - name: How to use them
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "IMAGE_PREFIX=$PREFIX IMAGE_TAG=$TAG docker compose --profile demo pull"
            echo "IMAGE_PREFIX=$PREFIX IMAGE_TAG=$TAG docker compose --profile demo up -d --no-build"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
